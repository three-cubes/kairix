name: "1b · Reference library benchmark gate (retrieval loop)"

on:
  pull_request:
    paths:
      - "kairix/core/search/**"
      - "kairix/core/facts/**"
      - "kairix/quality/benchmark/**"
      - "kairix/quality/eval/**"
      - "kairix/knowledge/reflib/**"
      - "kairix/use_cases/eval_suite.py"
      - "kairix/data/suites/reflib-contract-suite.yaml"
      - "benchmark-results/reflib-contract-baseline.json"
      - "reference-library/**"

permissions:
  contents: read
  id-token: write  # required for the conversation-eval job to federate to Azure via OIDC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  reflib-benchmark-gate:
    name: Reference library contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install kairix
        run: pip install -e ".[dev]"

      - name: Run reflib contract suite (mock backend)
        run: python3 scripts/run-reflib-contract.py

      - name: Compare against baseline
        run: python3 scripts/compare-reflib-baseline.py

  # Plan B-parity Week 4 Stream A — conversation eval gate.
  #
  # Discovers every reference-library/conversations/team-*/ corpus
  # and runs `kairix eval <suite> --json` against it. When a pinned baseline
  # exists under reference-library/conversations/expected/<suite>.json,
  # asserts the run does not regress by more than 2pp (gate fails the PR).
  # When the baseline is a sentinel ({"baseline": "not-yet-measured"}),
  # the run is recorded but not gated — "establishing baseline" mode.
  conversation-eval-gate:
    name: Conversation eval suites (team-*)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install kairix
        run: pip install -e ".[dev]"

      # Azure OIDC login + Key Vault secret loading. The federated App
      # Registration holds the "Key Vault Secrets User" role on the
      # configured KV. With KAIRIX_KV_NAME set, kairix.secrets fetches
      # the provider creds at runtime — same code path the VM uses, no
      # long-lived GH secret to rotate.
      - name: Azure login (federated OIDC)
        uses: three-cubes/tc-pipelines/.github/actions/wif-azure-login@07dad612b5f409a975c8356d556b07f3a855597c # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Materialise kairix.config.yaml from example
        run: cp kairix.example.config.yaml kairix.config.yaml

      - name: Eval conversation corpora
        env:
          KAIRIX_KV_NAME: ${{ vars.KAIRIX_KV_NAME }}
        run: bash scripts/ci/eval-conversation-corpora.sh

      - name: Upload per-corpus results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-eval-results
          path: /tmp/conversation-eval/
          if-no-files-found: warn
          retention-days: 14
