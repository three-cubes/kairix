name: verify-and-close

# On-merge-to-main adoption of the org-shared, DETERMINISTIC close side of the
# Autonomous Delivery loop — kairix is the FIRST consumer of the reusable
# `three-cubes/tc-pipelines/.github/workflows/verify-and-close.yml@v2.2.0`
# (Autonomous Delivery Platform initiative · SP-C-3, decision D5). It replaces a
# human/agent manually verifying a merge and hand-marking the linked Linear
# issue Done.
#
# On every push to `main` (a merged PR) the reusable, in order:
#   1. Resolves the linked Linear issue id from the merged PR's branch name
#      (org convention `<user>/<team>-<number>-<slug>`, e.g. `dan/pla-311-...`
#      => PLA-311) or, failing that, the merged PR body. If NEITHER resolves it
#      emits a documented SKIP and does NOT touch Linear (a false-close is worse
#      than a skip).
#   2. Runs the kairix post-merge verification below (`verify-command`) with the
#      merged commit checked out — a lean install+import+CLI smoke that proves
#      the merged tree is installable and the `kairix` entrypoint resolves. Its
#      exit code is the interim gate.
#   3. On PASS: transitions the issue to Done and comments
#      `verification-confirmed on <sha>`.
#   4. On FAIL: moves the issue to the needs-fix state, adds `needs-redispatch`,
#      comments the failing run link, then surfaces red on main so the backlog
#      dispatcher re-picks it (never silently dropped).
#
# ── NO GITHUB SECRET REQUIRED — the Linear key is read from Key Vault ─────────
# The reusable authenticates to the Linear GraphQL API with a key it fetches
# at RUNTIME from Azure Key Vault over Workload Identity Federation (OIDC).
# There is NO long-lived `LINEAR_API_KEY` Actions secret to add, store, or
# rotate on this repo — nothing to provision. This caller federates with the
# repo's existing WIF variables (`AZURE_CLIENT_ID` / `AZURE_TENANT_ID` /
# `AZURE_SUBSCRIPTION_ID`), whose App Registration already holds `Key Vault
# Secrets User` on the vault named by `KAIRIX_KV_NAME`; the reusable then
# reads the `ci-verify-and-close` secret (the Linear API key) from that vault.
# Same zero-standing-secret path the reflib benchmark gate already uses for
# provider creds. If WIF or the KV read fails, or the issue can't be resolved,
# the reusable emits a documented SKIP and does NOT touch Linear — a
# false-close is worse than a skip.
#
# Injection-safety: the reusable env-binds every caller input and every
# github.event.* field before it reaches a shell body, and runs `verify-command`
# via a deliberate `bash -c` WITHOUT the KV-sourced Linear key in its
# environment. The `uses:` ref is pinned to the immutable-per-release `@v1` tag.

on:
  push:
    branches: [main]

# `id-token: write` lets the reusable mint the OIDC token it exchanges for an
# Azure access token (WIF) to read the Linear key from Key Vault; `contents:
# read` + `pull-requests: read` let it check out the merged tree and read the
# merged PR. The effective grant is the intersection with this caller, so we
# grant exactly those. No write scope — the Linear transition goes over the
# KV-sourced API key, not the GITHUB_TOKEN.
permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  verify-and-close:
    name: verify-and-close
    uses: three-cubes/tc-pipelines/.github/workflows/verify-and-close.yml@07dad612b5f409a975c8356d556b07f3a855597c # v2.2.0
    with:
      # fetch-depth: 0 so setuptools-scm can derive a real version from tags on
      # the source install below (the reusable defaults to a shallow depth-1
      # checkout; kairix's build falls back to 0.0.0 without tags).
      fetch-depth: 0
      # Lean post-merge smoke: build a throwaway venv (ubuntu images mark the
      # system interpreter externally-managed / PEP 668), install the MERGED
      # tree, then assert the package imports and the `kairix` CLI entrypoint
      # resolves. This exercises the merged change end-to-end at the
      # packaging + import + CLI layer with no provider secrets — the same shape
      # release-smoke's wheel-smoke uses, run against source instead of PyPI.
      # `set -euo pipefail` because the reusable runs this via a bare `bash -c`.
      verify-command: |
        set -euo pipefail
        python3 -m venv .verify-venv
        . .verify-venv/bin/activate
        python -m pip install --upgrade pip
        pip install .
        python -c "import kairix; print(f'post-merge smoke: import OK, kairix {kairix.__version__}')"
        kairix --version
        kairix --help >/dev/null
        echo "post-merge smoke PASS: merged tree installs, imports, and the kairix CLI entrypoint resolves"
      # Key Vault fetch of the Linear API key over WIF — no GitHub secret. The
      # reusable federates with the client/tenant/subscription below, then reads
      # `linear-key-secret-name` from the vault named by `linear-key-vault`.
      linear-key-vault: ${{ vars.KAIRIX_KV_NAME }}
      linear-key-secret-name: ci-verify-and-close
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
