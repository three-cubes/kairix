name: "Fresh-install smoke (F81)"

# F81 first cut — proves a stranger's fresh install boots: clean dir →
# the README's literal docker-compose quick-start path → assertions
# (healthz/ready, MCP handshake, setup wizard behind its flag, BM25
# search). CI has no provider secrets, so the embedding/vector legs are
# excluded in this cut; see the scope note in
# scripts/checks/check-fresh-install-smoke.sh.
#
# NON-required workflow: not a branch-protection check, does not block
# PR merge. Runs nightly on main, on demand, and on PRs touching the
# fresh-install surface.
#
# EPIC #499 Wave 3b: the build+smoke body now consumes the shared org
# reusable three-cubes/tc-pipelines/fresh-install-smoke.yml@v2.2.0 (generalized
# FROM this very workflow). The build half (buildx + gha-cached build-push,
# tagged ghcr.io/three-cubes/kairix:fresh-smoke, load-only) and the smoke half
# (export KAIRIX_IMAGE_TAG → bash scripts/checks/check-fresh-install-smoke.sh)
# are byte-equivalent to the previous inline steps; this thin caller owns only
# the `on:` triggers (a reusable can't carry them) and the input wiring.

on:
  workflow_dispatch:
  schedule:
    # Nightly on main, offset from soak-suite / other nightlies.
    - cron: "23 16 * * *"
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'docker/**'
      - 'kairix/platform/setup/**'
      - 'kairix/install/**'
      - 'scripts/install/**'
      - 'scripts/checks/check-fresh-install-smoke.sh'
      - '.github/workflows/fresh-install-smoke.yml'
      - '.env.example'
      - 'kairix.config.example.yaml'

permissions:
  contents: read

jobs:
  fresh-install-smoke:
    name: "Fresh install smoke"
    uses: three-cubes/tc-pipelines/.github/workflows/fresh-install-smoke.yml@07dad612b5f409a975c8356d556b07f3a855597c # v2.2.0
    with:
      image-name: ghcr.io/three-cubes/kairix
      image-tag: fresh-smoke
      build-context: .
      dockerfile: Dockerfile
      smoke-script: scripts/checks/check-fresh-install-smoke.sh
      smoke-env-var-name: KAIRIX_IMAGE_TAG
      timeout-minutes: 45
