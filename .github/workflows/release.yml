name: "5 · Release (tag + GitHub release from CHANGELOG)"

# Manual-dispatch release workflow. Resolves #170: takes the previously
# manual sequence (tag main, push tag, create GitHub Release with notes
# copy-pasted from CHANGELOG) and bundles it into one step.
#
# Pre-requisite: main has already been merged through a
# normal PR (which gates on CI + Sonar). This workflow only does the
# tagging + release-creation + CHANGELOG-extraction part.
#
# All input values are passed through env: bindings before being used
# in run: scripts (avoids workflow-injection via input string).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to create (e.g. v2026.5.10.6)'
        required: true
        type: string
      changelog_label:
        description: 'CHANGELOG section to use for release notes (default: Unreleased)'
        required: false
        default: 'Unreleased'
        type: string

permissions:
  contents: write  # required to create tags + releases
  actions: write   # required to dispatch downstream publish workflows (#230)
  id-token: write  # WIF: mint the three-cubes-agent App token from Key Vault

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-alpha-gate:
    # #272 Phase 5: refuse to tag stable unless (a) an alpha tag exists
    # for the same compute-version AND (b) that alpha SHA has a green
    # `vm-reflib-regression` commit status from release-vm-deploy.yml.
    # release-vm-deploy.yml's `post-reflib-status` job posts that status
    # after the VM deploy + reflib gate (apply-alpha.sh onboard fully_passed
    # + delta <= tolerance), so this gate proves the alpha PASSED its VM
    # regression check, not merely that an operator cut a tag. (The old
    # Go alpha-deploy webhook that previously posted it is retired — PLA-250.)
    name: "5a · Alpha-gate (must precede stable)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Verify alpha tag exists + has green vm-reflib-regression status
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Strip the leading "v" then look for any v${stripped}a* alpha tag.
          # e.g. v2026.5.15 → looks for v2026.5.15a1, v2026.5.15a2, ...
          #      v2026.5.15.1 → looks for v2026.5.15.1a1, v2026.5.15.1a2, ...
          stripped="${VERSION#v}"
          git fetch --tags origin
          matches=$(git tag --list "v${stripped}a*" | sort -V)
          if [ -z "$matches" ]; then
            echo "::error::No alpha tag found for $VERSION. Run release-alpha.yml first."
            echo ""
            echo "fix: dispatch the '2a · Release (alpha tag from main)' workflow with date_version=${stripped} and alpha_n=1."
            echo "  next: once the alpha lands, release-vm-deploy.yml runs automatically; re-run this workflow when its commit-status goes green."
            echo "  run:  gh workflow run release-alpha.yml --ref main -f date_version=${stripped} -f alpha_n=1"
            exit 1
          fi
          latest_alpha=$(echo "$matches" | tail -1)
          echo "alpha-gate: stable $VERSION requires alpha — found $latest_alpha"

          # Resolve the alpha tag's commit SHA (tag may be annotated).
          ref_json=$(gh api "repos/${REPO}/git/refs/tags/${latest_alpha}")
          alpha_sha=$(echo "$ref_json" | jq -r '.object.sha')
          ref_type=$(echo "$ref_json" | jq -r '.object.type')
          if [ "$ref_type" = "tag" ]; then
            alpha_sha=$(gh api "repos/${REPO}/git/tags/${alpha_sha}" --jq '.object.sha')
          fi
          echo "alpha-gate: $latest_alpha -> $alpha_sha"

          # Read the latest vm-reflib-regression status for that SHA.
          status_json=$(gh api "repos/${REPO}/commits/${alpha_sha}/statuses" \
            --jq '[.[] | select(.context == "vm-reflib-regression")] | sort_by(.updated_at) | last')
          if [ -z "$status_json" ] || [ "$status_json" = "null" ]; then
            echo "::error::No vm-reflib-regression status on $latest_alpha ($alpha_sha)."
            echo ""
            echo "fix: dispatch release-vm-deploy.yml for the alpha — its post-reflib-status"
            echo "     job posts the vm-reflib-regression status after the VM deploy+reflib gate."
            echo "  run:  gh workflow run release-vm-deploy.yml --ref main -f tag=${latest_alpha}"
            echo "  next: once the status is success, re-run this workflow."
            exit 1
          fi
          state=$(echo "$status_json" | jq -r '.state')
          desc=$(echo "$status_json" | jq -r '.description')
          echo "vm-reflib-regression on $latest_alpha: state=$state desc=$desc"
          if [ "$state" != "success" ]; then
            echo "::error::Alpha $latest_alpha has vm-reflib-regression state=$state (not 'success'). Refusing to tag stable."
            echo ""
            echo "fix: investigate the alpha-deploy failure in the release-vm-deploy.yml run"
            echo "     for $latest_alpha — the status's target_url links it. Read the deploy-vm"
            echo "     job's apply output (apply-alpha.sh: a 'FAIL apply-alpha:' line on a"
            echo "     compose/onboard/regression failure, or 'KAIRIX_REFLIB verdict=regress' on"
            echo "     a reflib regression); see docs/runbooks/kairix-retrieval-health.md."
            echo "     Once the underlying regression is fixed and a new alpha cut + passed, re-run this workflow."
            exit 1
          fi
          echo "::notice::Alpha gate cleared: $latest_alpha has vm-reflib-regression=success ($desc)"

  release:
    name: Tag main + create GitHub Release
    needs: check-alpha-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      # Mint a short-lived three-cubes-agent App installation token over WIF
      # (Key Vault → App ID + private key → token). Release tagging, the
      # GitHub Release, and the downstream-workflow dispatches all act as the
      # App identity, not github-actions[bot] — clean authorship, no
      # GitHub-stored secret. Canonical in tc-pipelines; don't reinvent.
      - name: Mint three-cubes-agent App token
        id: app
        uses: three-cubes/tc-pipelines/.github/actions/github-app-token@07dad612b5f409a975c8356d556b07f3a855597c # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$'; then
            echo "::error::version '$VERSION' does not match CalVer pattern vYYYY.M.D[.N]"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::tag '$VERSION' already exists"
            exit 1
          fi

      # The F49 baseline check imports the shared three-cubes-fitness
      # package (tc_fitness, [dev] group) via _rule_catalogue.py. Since
      # EPIC #499 (2026-06-16) moved the catalogue schema into tc_fitness,
      # running these scripts under the bare system interpreter crashes
      # with ModuleNotFoundError (the bash wrapper masks it as a false
      # "baselines did not shrink"). Sync the venv via the org-shared
      # composite, then run the checks under it — mirrors the Stage 0
      # arch-fitness job in ci.yml.
      - uses: three-cubes/tc-pipelines/actions/setup-uv-cached@07dad612b5f409a975c8356d556b07f3a855597c # v2.2.0
        with:
          python-version: "3.12"
          sync-args: "--all-extras --all-groups"

      - name: F49 — baselines shrink per release
        # Each release must reduce the F30/F46/F47 test-discipline
        # baselines by at least one entry vs the previous release
        # tag, or keep all three at zero. See
        # docs/architecture/test-discipline-hardening.md §3 (F49).
        # Runs only here, not per-commit — baselines don't change
        # between commits within a release window.
        run: uv run bash scripts/checks/check-baseline-shrinking.sh

      - name: KFEAT-018 — paydown doc snapshot currency
        # The State table in docs/architecture/grandfathering-paydown.md
        # must be re-stamped within 7 days of the most recent release
        # tag (or carry an `<!-- expected-out-of-date-until: ... -->`
        # extension comment with rationale). Mirrors the F49 invocation
        # above: release-time only, not per-commit.
        # See docs/features/KFEAT-018-paydown-doc-refresh/BRIEF.md.
        run: uv run python3 scripts/checks/check_paydown_doc_currency.py

      - name: Extract release notes from CHANGELOG

        env:
          LABEL: ${{ inputs.changelog_label }}
        run: |
          python scripts/extract_changelog_section.py --version "$LABEL" > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::no release notes extracted for [$LABEL]"
            exit 1
          fi
          echo "::group::Release notes preview"
          cat /tmp/release-notes.md
          echo "::endgroup::"

      - name: Tag main
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          # Author the tag as the three-cubes-agent App, not github-actions[bot].
          # The noreply email uses the App bot user's numeric id
          # (295831460) in the canonical <id>+<slug>[bot]@users.noreply...
          # form so GitHub attributes the commit to the App identity.
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "295831460+three-cubes-agent[bot]@users.noreply.github.com"
          # Push the tag as the App: re-point origin auth at the App token so
          # the push is attributed to the App identity, not the runner's
          # default GITHUB_TOKEN that actions/checkout configured.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -a "$VERSION" -m "kairix $VERSION"
          git push origin "$VERSION"

      - name: Build reference-library corpus tarball (#450)
        # The reference-library corpus is NOT bundled in the wheel
        # (mixed-license, ~50 MB). `kairix benchmark install-corpus`
        # fetches it from this per-release asset, sha256-verified
        # fail-closed. Asset name matches the URL template in
        # kairix/quality/benchmark/corpus.py
        # (reference-library-${VERSION}.tar.gz + a .sha256 sidecar).
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tarball="reference-library-${VERSION}.tar.gz"
          tar czf "$tarball" reference-library/
          sha256sum "$tarball" | awk '{print $1}' > "${tarball}.sha256"
          echo "::group::Corpus asset"
          ls -lh "$tarball" "${tarball}.sha256"
          cat "${tarball}.sha256"
          echo "::endgroup::"

      - name: Create GitHub Release (draft for human review)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # Release lands as a draft so an operator can review the rendered
          # release notes (extracted from CHANGELOG.md) before clicking
          # Publish on GitHub. The git tag + docker image + PyPI artefacts
          # ship deterministically from the tag SHA regardless of the
          # release draft/published state, so this gate is on the
          # operator-facing release notes only.
          #
          # The reference-library corpus tarball + sha256 sidecar are
          # attached as release assets (#450) so
          # `kairix benchmark install-corpus` can fetch + verify them.
          gh release create "$VERSION" \
              --title "kairix $VERSION" \
              --notes-file /tmp/release-notes.md \
              --draft \
              --verify-tag \
              "reference-library-${VERSION}.tar.gz" \
              "reference-library-${VERSION}.tar.gz.sha256"

      - name: Fan out to docker-publish + publish-pypi
        # Releases created via GITHUB_TOKEN don't fan out to other
        # workflows (GitHub's recursion guard — #230). We explicitly
        # dispatch the downstream workflows here so a single
        # `gh workflow run release.yml` call ends with image + PyPI
        # published, no manual follow-up required. Dispatching as the App
        # token (not github.token) keeps the identity consistent.
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run docker-publish.yml --ref main --field ref="$VERSION"
          gh workflow run publish-pypi.yml   --ref main --field ref="$VERSION"

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Release $VERSION created"
            echo ""
            echo "- Tag pushed: \`$VERSION\`"
            echo "- GitHub Release created with notes from CHANGELOG.md"
            echo "- Downstream publishes dispatched:"
            echo "  - 3 · Docker publish (release)"
            echo "  - 4 · PyPI publish (release)"
          } >> "$GITHUB_STEP_SUMMARY"
