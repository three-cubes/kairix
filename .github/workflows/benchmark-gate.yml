name: "1a · Benchmark gate (retrieval loop)"

# Automatic regression gate — runs on every PR that touches retrieval logic.
# Uses the mock retrieval backend (no Azure API required).
# Compares against the committed baseline in benchmark-results/contract-baseline.json.
#
# FAIL conditions:
#   - overall weighted_total drops by > 0.02 from baseline
#   - any category score drops below 0.50
#
# To update the baseline after an intentional change:
#   python3 -c "
#     from kairix.quality.benchmark.suite import load_suite, resolve_suite_path
#     from kairix.quality.benchmark.runner import run_benchmark
#     import json
#     suite = load_suite(str(resolve_suite_path('contract-suite')))
#     result = run_benchmark(suite, system='mock', agent='shared')
#     data = {'meta': result.meta, 'summary': result.summary, 'diagnostics': result.diagnostics, 'cases': result.cases}
#     json.dump(data, open('benchmark-results/contract-baseline.json', 'w'), indent=2)
#   "
#   Then commit benchmark-results/contract-baseline.json with the PR.

on:
  pull_request:
    paths:
      - "kairix/core/search/**"
      - "kairix/quality/benchmark/**"
      - "kairix/core/temporal/**"
      - "kairix/core/embed/**"
      - "kairix/knowledge/graph/**"
      - "kairix/data/suites/contract-suite.yaml"
      - "benchmark-results/contract-baseline.json"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  benchmark-gate:
    name: Benchmark gate (contract suite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run contract suite (mock backend)
        run: |
          python3 -c "
          from kairix.quality.benchmark.suite import load_suite, resolve_suite_path
          from kairix.quality.benchmark.runner import run_benchmark
          import json

          suite = load_suite(str(resolve_suite_path('contract-suite')))
          result = run_benchmark(suite, system='mock', agent='shared', output_dir=None)
          data = {
              'meta': result.meta,
              'summary': result.summary,
              'diagnostics': result.diagnostics,
              'cases': result.cases,
          }
          with open('/tmp/contract-current.json', 'w') as f:
              json.dump(data, f, indent=2)
          print(f'weighted_total: {result.summary[\"weighted_total\"]}')
          for cat, score in sorted(result.summary['category_scores'].items()):
              print(f'  {cat:<14} {score:.4f}')
          from kairix.quality.completeness import judge_failures, partial_warning
          if judge_failures(result):
              print(partial_warning('contract suite run', judge_failures(result)))
          "

      - name: Compare against baseline
        id: compare
        run: |
          python3 -m kairix.quality.benchmark.baseline \
            benchmark-results/contract-baseline.json \
            /tmp/contract-current.json

      - name: Build PR comment body
        if: always() && github.event_name == 'pull_request'
        id: comment_body
        env:
          GATE_OUTCOME: ${{ steps.compare.outcome }}
        # Completeness is checked first (shared kairix.quality.completeness):
        # a partial result renders only the INCONCLUSIVE diagnostic, no table.
        run: |
          python3 scripts/ci/benchmark_pr_comment.py \
            /tmp/contract-current.json \
            benchmark-results/contract-baseline.json \
            "$GATE_OUTCOME" \
            /tmp/comment-body.txt

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body;
            try {
              body = fs.readFileSync('/tmp/comment-body.txt', 'utf8');
            } catch (e) {
              body = '⚠️ Benchmark gate: could not read results.';
            }

            // Find and update existing bot comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Benchmark Gate — Contract Suite')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
