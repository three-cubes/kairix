version: 2

# Supply-chain hardening: every version update sits in a 7-day cooldown
# (semver-major: 14 days). Cooldown only applies to version updates —
# security advisories still surface immediately so CVE patches aren't
# delayed. Rationale: worm-injection attacks on package managers
# (npm, PyPI) typically get caught and yanked within days of release.

updates:
  # Python dependencies (pip)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    reviewers:
      - quanyeomans
    labels:
      - dependency
      - automated
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    # Group minor/patch updates to reduce PR noise
    # mcp 2.x changes the server and client APIs kairix's MCP interface uses;
    # version updates wait for the PLA-415 migration. Security updates still surface.
    ignore:
      - dependency-name: "mcp"
        versions: [">=2"]
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "mypy*"
          - "ruff"
          - "bandit"
          - "pip-audit"
          - "coverage*"
          - "types-*"
        update-types:
          - "minor"
          - "patch"

  # Go modules — the two services/<name>/go.mod modules gated by
  # go-quality.yml. Without these entries Dependabot never raised a Go
  # update PR (broken targeting, not the OFF toggle): the pip + actions
  # ecosystems below only cover the repo root, so the Go module tree was
  # invisible to version + security updates. `directories:` (glob) targets
  # both modules with one entry and auto-covers any future services/* module.
  - package-ecosystem: gomod
    directories:
      - "/services/*"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 3
    reviewers:
      - quanyeomans
    labels:
      - dependency
      - automated
      - go
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 3
    reviewers:
      - quanyeomans
    labels:
      - dependency
      - automated
      - github-actions
    commit-message:
      prefix: "chore(actions)"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
