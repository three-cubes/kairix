[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. The Python import path is still ``kairix``
# (source layout under kairix/, console script entry remains ``kairix``).
# The dist name here matches the trusted-publisher record on PyPI;
# the short ``kairix`` slot was already reserved by another account
# with no releases, so we publish under the long-form name and users
# can still ``import kairix`` after install.
#
# IMPORTANT: this rename was previously made in v2026.5.10.1 and got
# reverted by the squash merge of #176 (squash merges from develop
# don't preserve commit-level history; develop's pyproject hadn't
# been re-synced after v2026.5.10.1 landed on main). #170 tracks
# automating the post-squash sync; until that lands, double-check
# this line after every release.
name = "Kairix-agentic-knowledge-mgt"
dynamic = ["version"]
description = "Self-contained knowledge retrieval engine — hybrid search, entity graph, temporal reasoning, session briefing"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "usearch>=2.8,<3",
    "langgraph>=1.0.10,<2",
    "lxml>=6.1.0",
    "openai>=1.40,<3",
    # Filesystem-event watcher — Apache 2.0, commercial-safe. First-party
    # Obsidian connector (``kairix/connectors/obsidian/``) tails vault
    # edits between full-scan reconciliation passes. Per F37, ``watchdog``
    # may only be imported under ``kairix/connectors/<name>/`` or
    # ``kairix/core/connectors/``.
    "watchdog>=3.0.0,<7",
    # tenacity (Apache-2.0) — exponential-backoff retry primitive.
    # Adopted per docs/architecture/connector-oss-library-evaluation.md
    # §7 recommendation: replaces ~30 LoC of hand-rolled retry in
    # kairix/connectors/dex_crm/client.py and prevents future
    # connectors reinventing the loop. One dep, no transitives, scoped
    # to HTTP-client retry surfaces. The OSS evaluation rejected every
    # full connector framework on H1 (raw binary blobs); tenacity is
    # the sole library adoption that came out of that evaluation.
    "tenacity>=8,<10",
    # jinja2 (BSD) — template rendering for systemd unit + kairix.config.yaml
    # in kairix.install.systemd / installer. Base dependency because
    # kairix init runs on a freshly pip-installed host with no extras.
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
agents = [
    # MCP server (Model Context Protocol — exposes kairix tools to agents).
    # Floor 1.20 ensures streamable-HTTP transport and stateless mode are GA;
    # see Sprint 19 plan WS1 (engineering/SPRINT-19-PLAN.md).
    "mcp>=1.20,<2",
]
neo4j = [
    # Neo4j Python driver — required for entity graph, multi-hop queries, and curator health
    "neo4j>=5.0,<7.0",
]
nlp = [
    "spacy>=3.7,<4",
]
rerank = [
    # Cross-encoder re-ranking (post-RRF semantic pass). CPU-only, ~22 MB model.
    "sentence-transformers>=3.0,<7",
]
bedrock = [
    # AWS SDK — required only when KAIRIX_PROVIDER=bedrock. boto3 is heavy
    # (~50 MB with botocore + s3transfer transitive deps) so operators not
    # on AWS opt out by skipping this extra. The bedrock plugin imports
    # boto3 lazily inside its credential resolver so installs without this
    # extra raise a clear "fix:" error only when the plugin is actually
    # selected, never at module import time.
    "boto3>=1.34,<2",
]
markitdown = [
    # markitdown (MIT, Microsoft) — rich-document extractor for PDF / DOCX
    # / PPTX / XLSX / HTML. Heavy transitive deps (onnxruntime, magika,
    # protobuf, plus pdfminer-six + pdfplumber + cryptography + pillow
    # via the [pdf] extra) so operators ingesting only markdown /
    # plain-text content skip the extra and stay on
    # ``kairix.extractors.passthrough``.
    # ``kairix.extractors.markitdown`` lazy-imports the library inside the
    # plugin's converter factory; module import succeeds without the
    # extra, only ``extract()`` raises a typed error when the upstream is
    # absent. Floor pinned at 0.1.5 (current stable on PyPI, MIT-licensed).
    # The ``[pdf,docx,xlsx,pptx,outlook]`` extras pull every per-format
    # converter dependency markitdown's PER-CONVERTER plugins need —
    # pdfminer-six + pdfplumber for PDF, python-docx for Word,
    # openpyxl for Excel, python-pptx for PowerPoint, olefile for
    # Outlook .msg. Without these sub-extras markitdown registers the
    # converters but each raises ``MissingDependencyException`` at
    # ``extract()`` time. v2026.5.26a1 dogfood (#322) — the production
    # Docker image was missing all five and every binary-doc fetch
    # dead-lettered.
    # GH #337 — added [xls] (legacy Excel; distinct from [xlsx] modern Open XML)
    # after production SharePoint dead-letter showed XlsConverter raising
    # MissingDependencyException on legacy .xls files. ~10-15 items will recover.
    "markitdown[pdf,docx,xls,xlsx,pptx,outlook]>=0.1.5,<1",
]
pdf_fallback = [
    # pdfplumber (MIT, Jeremy Singer-Vine) — fallback PDF extractor used
    # when markitdown recovers content poorly (complex tables, mixed
    # text+image pages). Wave 3 MM-1. Decision 4 ruling: pdfplumber is
    # shipped because its MIT licence keeps the kairix distribution
    # commercial-safe. pymupdf (AGPL) is NOT shipped.
    "pdfplumber>=0.11.0,<1",
]
docx = [
    # python-docx (MIT) — heading-hierarchy-aware Word extractor used
    # by ``kairix.extractors.docx`` (Wave 4 OF-2). Light dependency
    # tree (lxml + typing-extensions); markitdown already pulls
    # python-docx transitively, so operators on the rich-document
    # extra get the heading-aware path for free. Declared as a
    # standalone extra so operators on passthrough-only deployments
    # can opt into the docx extractor without the markitdown
    # transitive set.
    "python-docx>=1.0,<2",
]
ocr = [
    # OCR extractor (Wave 3 MM-2). Tesseract is the default per Decision 5
    # (Apache 2.0, CPU-only). PaddleOCR is the opt-in follow-up.
    # Runtime dep NOT installable via pip: the Tesseract C++ engine itself.
    # Operators install via ``brew install tesseract`` (macOS) /
    # ``apt install tesseract-ocr`` (Debian/Ubuntu).
    "pytesseract>=0.3.10,<1",
    "opencv-python-headless>=4.8,<6",
    "Pillow>=10.0,<13",
    "pdfplumber>=0.10,<1",
]
pptx = [
    # python-pptx (MIT) — slide-aware extractor for .pptx decks (Wave 4 OF-1).
    "python-pptx>=1.0,<2",
]
xlsx = [
    # openpyxl (MIT) — sheet-as-document extractor for .xlsx (Wave 4 OF-3).
    # Each non-empty worksheet → Page; merged cells collapse to top-left;
    # formula cells render via ``data_only=True`` cached display values.
    "openpyxl>=3.1,<4",
]
caldav = [
    # python-caldav (GPLv3) — CalDAV (RFC 4791) client library used by
    # the Apple iCloud CalDAV connector (``kairix.connectors.apple_caldav``).
    # Optional because the connector is gated by the
    # ``topology_v2_apple_caldav`` feature flag (default OFF) and
    # operators without an iCloud account skip both the dep and the
    # plugin. Per F37, ``caldav`` may only be imported inside the
    # connector's own ``client.py`` (which lazy-imports it on first use).
    "caldav>=1.3,<4",
]
connect = [
    # ADR-032 ``kairix connect`` OAuth2 token-capture CLI family.
    # google-auth + google-auth-oauthlib: the consent dance for
    # ``kairix connect google-{gmail,drive,calendar}`` and the runtime
    # refresh wrapper used by the Drive + Calendar + Gmail connectors
    # to mint fresh access tokens transparently (closes the silent-401
    # bug Drive + Calendar previously surfaced as CredentialExpiredError).
    # azure-identity + azure-keyvault-secrets — only loaded when the  # pragma: allowlist secret
    # operator passes ``--store=azure-kv*``; default ``--store=file``
    # skips both. DefaultAzureCredential walks the standard chain
    # (managed identity → env → cached ``az login``).
    # pyjwt[crypto] + cryptography — JWT signing for the GitHub App
    # flow (``kairix connect github-app``) and the runtime
    # GitHubAppRefreshableToken used by the GitHub connector when in
    # App mode. ``[crypto]`` extra pulls cryptography for RS256 support;
    # both are lazy-imported inside kairix.connect.oauth2.github_app
    # + kairix.connect.refresh so operators not using App mode skip them.
    # All deps below are lazy-imported inside the modules that need them
    # so operators on the default file-store + non-GitHub path never load
    # the Azure SDK or the JWT library.
    "google-auth>=2.40,<3",
    "google-auth-oauthlib>=1.2,<2",
    "azure-identity>=1.19,<2",
    "azure-keyvault-secrets>=4.9,<5",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=43,<51",
]
dev = [
    # Test runner
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3",
    "pytest-bdd>=7.0",
    # Test-suite sharding for the unit tier (CI matrix `--splits N --group M`).
    # Serial shards only — one process per runner. NEVER pytest-xdist / `-n`:
    # the memory-runtime invariant tests (F77 sqlite single-writer, F95 cypher
    # write-mode) race under intra-runner parallelism.
    "pytest-split>=0.9",
    # Type checking (engineering hub: zero errors, strict mode)
    "mypy>=1.9",
    "types-requests>=2.33.0.20260408",
    "types-PyYAML>=6.0",
    # Linting (engineering hub: linting blocks merge)
    "ruff==0.15.22",
    # Security (engineering hub: bandit zero HIGH/MEDIUM, pip-audit zero CVEs with fixes)
    "bandit[toml]>=1.7",
    "pip-audit>=2.10.0",
    # Secret detection
    "detect-secrets>=1.4",
]

# ── Fitness-engine dependency group (PLA-286) ────────────────────────────────
# The shared architecture-fitness engine (tc-fitness) is a git-URL dependency.
# PyPI rejects direct-URL references in a published wheel's Requires-Dist
# ("400 Can't have direct dependency"), so it must NOT live in a
# [project.optional-dependencies] extra — extras flow into wheel metadata. A
# PEP 735 [dependency-groups] group is dev-only and never part of a built
# distribution, so the wheel stays PyPI-acceptable while every gate context
# that runs the fitness checks still installs the engine via the group.
# tc_fitness is imported by scripts/checks/*.py AND the tests/checks +
# tests/architecture conftests, so the group is fed to every pytest-collecting
# gate consumer (see ci.yml Stage 2/3/4.5, soak-suite, baseline-audit,
# mutation-suite, and safe-commit.sh --pre-pr). The python_version marker is
# retained: the engine pins >=3.12 and kairix is >=3.12 so it always resolves,
# and the marker keeps uv's universal resolver happy.
[dependency-groups]
fitness = [
    "three-cubes-fitness @ git+https://github.com/three-cubes/tc-fitness.git@v0.14.1 ; python_version >= '3.12'",
]

# Include the fitness group in every `uv sync` / `uv run` so the local gate
# (safe-commit.sh) and the CI setup-uv-cached stages resolve tc_fitness with no
# explicit --group flag. Wheel metadata is unaffected — dependency groups are
# never published.
[tool.uv]
default-groups = ["fitness"]

[project.scripts]
kairix = "kairix.cli:main"

# Provider plugin discovery — name-filtered Python entry points.
# Operators select a provider by config string (KAIRIX_PROVIDER), not by
# import statement. Third parties ship their own pip distribution that
# declares the same group; ``pip install kairix-provider-foo`` then
# ``KAIRIX_PROVIDER=foo`` works with zero kairix code change. See
# docs/architecture/provider-plugin-architecture.md § Plugin discovery.
# Wave-1 factories raise NotImplementedError; Wave 2+ fills them in.
[project.entry-points."kairix.providers"]
azure_foundry = "kairix.providers.azure_foundry:make_provider"
azure_legacy  = "kairix.providers.azure_legacy:make_provider"
openai        = "kairix.providers.openai:make_provider"
bedrock       = "kairix.providers.bedrock:make_provider"
ollama        = "kairix.providers.ollama:make_provider"
litellm_proxy = "kairix.providers.litellm_proxy:make_provider"
anthropic     = "kairix.providers.anthropic:make_provider"

# Connector plugin discovery — same name-filtered Python entry-points
# shape as kairix.providers. Operators select connectors by config string
# (``connectors[].name`` in ``kairix.config.yaml``), not by import statement.
# Third parties ship their own pip distribution that declares the same group;
# ``pip install kairix-connector-foo`` then ``connectors: [foo]`` works with
# zero kairix code change. See
# docs/architecture/connector-ingestion-architecture.md §8.
# Wave 1 (SC-2): empty table; Wave 2 lands ``obsidian``; later waves add
# ``sharepoint``, ``dex_crm``, ``m365_email_headers``, ``m365_calendar``.
[project.entry-points."kairix.connectors"]
obsidian           = "kairix.connectors.obsidian:make_connector"
dex_crm            = "kairix.connectors.dex_crm:make_connector"
m365_email_headers = "kairix.connectors.m365_email_headers:make_connector"
m365_calendar      = "kairix.connectors.m365_calendar:make_connector"
sharepoint         = "kairix.connectors.sharepoint:make_connector"
notion             = "kairix.connectors.notion:make_connector"
github             = "kairix.connectors.github:make_connector"
slack              = "kairix.connectors.slack:make_connector"
gmail              = "kairix.connectors.gmail:make_connector"
google_drive       = "kairix.connectors.google_drive:make_connector"
apple_caldav       = "kairix.connectors.apple_caldav:make_connector"
google_calendar    = "kairix.connectors.google_calendar:make_connector"
linear             = "kairix.connectors.linear:make_connector"
skills             = "kairix.connectors.skills:make_connector"

# Extractor plugin discovery — same shape as kairix.providers above.
# Per-format-family plugins live under kairix/extractors/<name>/ and
# register here. Wave 2 IM-4 lands ``markitdown`` + ``passthrough``;
# Wave 3 will add ``pdf_fallback`` + ``ocr``. markitdown wraps the
# upstream library; the library is an optional dependency (extra
# ``markitdown``) so the core wheel stays light.
[project.entry-points."kairix.extractors"]
passthrough  = "kairix.extractors.passthrough:make_extractor"
markitdown   = "kairix.extractors.markitdown:make_extractor"
pdf_fallback = "kairix.extractors.pdf_fallback:make_extractor"
ocr          = "kairix.extractors.ocr:make_extractor"
pptx         = "kairix.extractors.pptx:make_extractor"
docx         = "kairix.extractors.docx:make_extractor"
xlsx         = "kairix.extractors.xlsx:make_extractor"
gotenberg    = "kairix.extractors.gotenberg:make_extractor"

# Chunker plugin discovery — same name-filtered Python entry-points
# shape as kairix.extractors above. Per-(kind, mime) plugins live under
# ``kairix/chunkers/<name>.py`` (single-file) or
# ``kairix/chunkers/<name>/`` (subdir) and register here so the
# ChunkerRegistry can resolve them by name at worker boot. ADR-028
# Wave G.1 lands the first batches.
[project.entry-points."kairix.chunkers"]
thread         = "kairix.chunkers.thread:ThreadChunker"
calendar_event = "kairix.chunkers.calendar_event:CalendarEventChunker"
slide          = "kairix.chunkers.slide:SlideChunker"
sheet_row      = "kairix.chunkers.sheet_row:SheetRowChunker"
docx_heading   = "kairix.chunkers.docx_heading:DocxHeadingChunker"
markdown_structural = "kairix.chunkers.markdown_structural:MarkdownStructuralChunker"
code           = "kairix.chunkers.code:CodeChunker"
email_thread   = "kairix.chunkers.email_thread:EmailThreadChunker"

[project.urls]
Homepage = "https://github.com/three-cubes/kairix"
Issues = "https://github.com/three-cubes/kairix/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
# Test markers — engineering hub test pyramid
# Usage: pytest -m contract | unit | integration | e2e
markers = [
    "contract: interface agreement tests (fast, <30s total, zero tolerance for failure)",
    "unit: individual component logic (mock externals, fast)",
    "integration: multi-component with real database and usearch index",
    "e2e: composed production path or live-credential end-to-end tests (set KAIRIX_E2E=1 for credential-gated subset; see docs/architecture/test-discipline-hardening.md §2.2)",
    "bdd: behaviour-driven acceptance tests (pytest-bdd feature files)",
    "pvt: production-verification scenarios against a live MCP server (requires KAIRIX_PVT=1; see docs/architecture/performance-testing-approach.md)",
    "slow: tests taking >5s",
    "soak: production-scale soak tests (N >= 10**4 rows). Excluded from Stage 2/3 per-commit CI; runs in soak-suite.yml on nightly + on-demand cadence. ~20-60 min wall-clock. See ADR-024 §'Soak tier' + .github/workflows/soak-suite.yml. The legacy BDD soak scenarios (tests/bdd/features/soak_fact_extractor.feature) still gate on KAIRIX_SOAK=1 at the step level.",
    "invariant: cross-layer integrity invariant tests under tests/integrity_invariants/ — ADR-024 §F72, asserts state agreement across bronze/content/vector/dead-letter tables after composed pipeline runs",
    "docker: tests that shell out to the docker CLI against a pre-built kairix image (requires KAIRIX_DOCKER_TEST_IMAGE or a local `docker build`; skips when docker is unavailable)",
    "load: load tests under tests/load/ that fire many concurrent MCP-style calls (issue #398 W-D). Excluded from default discovery; operators run via `pytest -m load tests/load/`. Wall-clock target ~30-90s; not a branch-protection check.",
    "current: BDD scenario passes on :main (post-this-PR)",
    "future: BDD scenario describes target state; gated runtime-only",
]
timeout = 60  # Per-test timeout default (seconds)

[tool.coverage.run]
source = ["kairix"]
relative_files = true
omit = [
    "tests/*",
    # Neo4j driver wrapper — connection/session paths require a live
    # Neo4j instance; the testable surface (FakeNeo4jClient-driven repo
    # methods) has its own coverage in kairix.knowledge.graph.repository.
    "kairix/knowledge/graph/client.py",
    # CLIs without BDD or integration coverage yet — flagged for backfill.
    # Each will move out of this list when tests land.
    "kairix/knowledge/reflib/cli.py",
    # Plan 1 task 8 — kairix init / uninstall thin argparse wrappers over
    # kairix.install.installer. Behaviour proof is in
    # tests/integration/test_cli_init.py + tests/integration/test_cli_uninstall.py
    # (subprocess F30 outcome tests). Unit coverage is intentionally
    # deferred — the wrappers are 100% delegation; the durable behaviour
    # surface is tests/install/test_installer.py. Same pattern as
    # kairix/knowledge/reflib/cli.py above.
    "kairix/install/init_cli.py",
    "kairix/install/uninstall_cli.py",
    # NOTE: benchmark/cli.py and wikilinks/audit.py removed from omit
    # after PR #247 — tests now exist (tests/benchmark/test_cli_helpers.py
    # and tests/wikilinks/test_audit_unit.py — 63 sabotage-proven tests).
    # NOTE: contradict/cli.py removed from omit after PR 2.6 / #421 —
    # tests now exist (tests/contracts/test_contradict_envelope_parity.py,
    # tests/bdd/features/contradict_through_warm_mcp.feature,
    # tests/integration/test_contradict_cli_json_mode.py).
]

[tool.coverage.report]
# Engineering hub: per-file floor at 90% (F7/F9). Overall fail_under
# tracks the current achievable floor while the per-file baseline burns
# down; raise toward 90 as the 34 grandfathered low-coverage files lift.
fail_under = 88
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # Abstract method stubs
]

# ── mypy ─────────────────────────────────────────────────────────────────────
# Engineering hub: "mypy — zero errors" (Python standard)
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
# Modules not yet fully annotated (will be removed as each phase ships)
[[tool.mypy.overrides]]
module = [
    "kairix.core.search.*",
    "kairix.core.temporal.*",
    "kairix.core.classify.*",
    "kairix.knowledge.summaries.*",
    "kairix.knowledge.contradict.*",
    "kairix.agents.briefing.*",
    "kairix.quality.benchmark.*",
]
# Modules not yet fully annotated — will be removed phase by phase
ignore_errors = true

# FastMCP decorator is untyped — suppress locally, CI doesn't have fastmcp installed
[[tool.mypy.overrides]]
module = ["kairix.agents.mcp.server"]
disallow_untyped_decorators = false

# ── ruff ─────────────────────────────────────────────────────────────────────
# Engineering hub: "Linting / code quality: blocks merge"
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print() in prod code)
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # use of assert (test code)
    "S608",  # SQL injection false positive — all dynamic SQL uses ? parameter binding
    "B008",  # function call in default arg (used in CLI argument defaults)
    "T201",  # print found (allowed in CLI modules — cli.py excluded below)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]           # Tests: allow assert + print
"tests/e2e/*" = ["S", "T20", "I001"]  # E2E tests: inline imports required for lazy loading
"kairix/**/cli.py" = ["T201", "S108", "S110", "E501"] # CLI modules: allow print for user output
"kairix/cli.py" = ["T201"]
"kairix/platform/onboard/check.py" = ["S607"]  # Trusted system binaries (openclaw, systemctl)
"scripts/*" = ["S", "T20", "B007"]    # Scripts: allow subprocess, print, unused loop vars

[tool.ruff.lint.isort]
# Match standalone isort profile="black"
known-first-party = ["kairix"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── bandit ───────────────────────────────────────────────────────────────────
# Engineering hub: "bandit — zero HIGH/MEDIUM findings"
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert_used — acceptable in test-adjacent code
]
# Any HIGH finding not listed here blocks the build.

[tool.setuptools.packages.find]
where = ["."]
include = ["kairix*"]

# Data files shipped inside Python packages.
#
# ``kairix.plugins.openclaw`` ships an openclaw plugin under
# ``memory-prompt/`` (#246 W5). The directory name is hyphenated because
# openclaw's plugin loader discovers plugins by directory slug, and
# ``kairix-memory-prompt`` is the slug admins put in ``plugins.allow``.
# Python cannot import hyphenated module names, so the directory is
# *data* inside the ``kairix.plugins.openclaw`` Python package rather
# than a sub-package of its own — package-data is the canonical way to
# ship arbitrary files alongside Python source.
#
# The glob below ensures ``plugin.py`` (the entry openclaw loads),
# ``plugin.json`` (the manifest openclaw parses) and ``README.md`` (the
# operator-facing config snippet) all land at
# ``<site-packages>/kairix/plugins/openclaw/memory-prompt/`` after
# ``pip install kairix``. The Dockerfile then exposes them at
# ``/opt/kairix/plugins/openclaw/memory-prompt/`` via a symlink so
# admins point openclaw at a stable path.
[tool.setuptools.package-data]
"kairix.plugins.openclaw" = [
    "memory-prompt/plugin.py",
    "memory-prompt/plugin.json",
    "memory-prompt/README.md",
]
# Plan B-parity Capability #2 ships the LLM-fact-extractor prompt
# template as package data so ``kairix.core.facts.LLMFactExtractor``
# can load it via ``importlib.resources`` from both source checkouts
# and installed wheels.
"kairix.core.facts.prompts" = [
    "*.txt",
]
# Plan 1 task 6 ships the systemd unit template as package data so
# ``kairix.install.systemd.render_unit`` can load it via jinja2's
# ``PackageLoader`` from both source checkouts and installed wheels.
"kairix.install" = [
    "templates/*.j2",
]
# The web setup wizard (#474) ships its Jinja templates + vendored
# static assets (pico CSS, htmx, kairix.css) as package data so
# ``kairix.platform.setup.web.routes`` can load templates via jinja2's
# ``PackageLoader`` and serve static files via importlib.resources from
# both source checkouts and installed wheels. Assets are vendored — no
# CDN reference survives into the rendered pages, so the wizard works
# in offline containers.
"kairix.platform.setup.web" = [
    "templates/setup/*.html",
    "templates/partials/*.html",
    "static/*",
]
# The agent usage guide (#466) ships as package data so it lands in BOTH
# the wheel and the Docker image (which pip-installs ``.``) and is immune
# to the ``/var/lib/kairix`` named-volume shadow. Before this, the only
# copy lived at the repo root under ``docs/`` — present in every source
# checkout but absent from the built image — so the ``usage_guide`` MCP
# tool returned ``UsageGuideNotFound`` on stock production deploys.
# ``kairix.use_cases.usage_guide`` reads these via ``importlib.resources``
# from both source checkouts and installed wheels.
"kairix.agents.usage_guide" = [
    "data/*.md",
]
# #450 — the benchmark suite YAMLs (≈86 KB) ship as package-data so a
# plain ``pip install`` resolves them via importlib.resources /
# ``kairix.paths.bundled_suites_root`` with no source checkout present.
# Before the relocation they lived at the repo root (outside ``kairix/``)
# and the ``packages.find`` include (``kairix*``) excluded them from the
# wheel. The heavy reference-library corpus is deliberately NOT bundled
# (mixed-license, ~50 MB) — it is fetched on demand by
# ``kairix benchmark install-corpus``.
"kairix.data" = [
    "suites/*.yaml",
    "suites/perf/*.json",
    "suites/README.md",
]

# Benchmark gates — kairix benchmark run exits non-zero if any gate fails.
# E2E test gate: set KAIRIX_E2E=1 to enable live Azure API tests.
[tool.kairix.benchmark.gates]
overall = 0.78
temporal = 0.55
entity = 0.80
contextual_prep = 0.60

# ── check-wheel-contents ─────────────────────────────────────────────────────
# The PyPI publish workflow runs ``check-wheel-contents`` via
# hynek/build-and-inspect-python-package. It flags W004 ("module is not
# located at importable path") on ``kairix/plugins/openclaw/memory-prompt/
# plugin.py`` because the hyphenated directory cannot be a Python module.
# That's intentional — the directory is package-data shipped to openclaw's
# plugin loader (see [tool.setuptools.package-data] above for the rationale).
# We exempt W004 globally; the alternative is renaming the file away from
# ``plugin.py``, which openclaw expects verbatim.
[tool.check-wheel-contents]
ignore = ["W004"]

# ── setuptools-scm — version derived from git tags ─────────────────────────
# No manual version editing. Tagged commits = clean version (2026.4.28).
# Untagged commits = dev version (2026.4.28.dev3 = 3 commits since tag).
# pip install kairix never installs dev versions unless --pre is passed.
[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

# ── tc-fitness gate declaration (the convergence surface) ────────────────────
# `uv run tc-fitness run` reads this block and dispatches kairix's OWN catalogue
# (scripts/checks/_rule_catalogue.py:ALL_ENTRIES) through the shared engine —
# the SAME binary tc-agent-zone runs, the SAME catalogue `run-all.sh` /
# `run_checks.py` dispatch. ADDITIVE: run_checks.py + run-all.sh + safe-commit.sh
# keep working unchanged (they thread kairix's --skip-coverage + scope-resolver
# seams); this block is the engine-native entrypoint CI Stage 0 invokes.
[tool.tc_fitness]
name = "kairix quality gate (architecture fitness catalogue)"

# The catalogue step: kairix's full RuleEntry tuple. Local rows dispatch as
# guarded subprocesses (parallel); core:<module> rows are forced in-process by
# the engine with their [tool.tc_fitness.core_checks.<module>] block injected.
[[tool.tc_fitness.steps]]
id = "fitness-catalogue"
summary = "architecture fitness functions (full catalogue)"
catalogue = "scripts.checks._rule_catalogue:ALL_ENTRIES"
checks_dir = "scripts/checks"
dispatch = "subprocess"
parallel = true

# ── CORE-check config blocks (one per bound check) ───────────────────────────
# Mirrors scripts/checks/_core_bindings.py:CORE_BINDINGS verbatim. Only checks
# PROVEN equivalent to their retired local reimplementation are bound — same raw
# violation set on kairix's tree + positive/negative differential fixture parity.

[tool.tc_fitness.core_checks.no_duplicate_string]
roots = ["kairix"]
extensions = [".py"]
min_length = 10
min_occurrences = 3
name = "no-duplicate-string"

[tool.tc_fitness.core_checks.new_code_coverage]
# Sonar-exact "Coverage on New Code >= 80%" mirrored locally: fail changed .py whose
# ADDED lines are <80% covered (complements the repo --cov-fail-under floor + the
# per-file floor by scoring new lines in isolation). Runs as a dedicated step AFTER
# pytest writes coverage.xml (Makefile); in `tc-fitness run` it soft-skips (no report).
floor_pct = 80.0
coverage_report = "coverage.xml"
base_ref = "origin/main"
roots = ["kairix", "scripts", "tools"]
extensions = [".py"]
name = "new-code-coverage"

[tool.tc_fitness.core_checks.no_commented_out_code]
roots = ["kairix"]
extensions = [".py"]
min_run = 3
name = "no-commented-out-code"

[tool.tc_fitness.core_checks.cognitive_complexity]
roots = ["kairix"]
extensions = [".py"]
threshold = 15
name = "cognitive-complexity"

[tool.tc_fitness.core_checks.unused_params_named]
roots = ["kairix"]
extensions = [".py"]
name = "unused-params-named"

[tool.tc_fitness.core_checks.empty_body_intent]
roots = ["kairix"]
extensions = [".py"]
name = "empty-body-intent"

[tool.tc_fitness.core_checks.no_test_imports_in_prod]
roots = ["kairix"]
extensions = [".py"]
name = "no-test-imports-in-prod"

[tool.tc_fitness.core_checks.test_skip_rationale]
roots = ["tests"]
extensions = [".py"]
name = "test-skip-rationale"

# F95 — cypher write-mode selection lives at ONE chokepoint. Only
# kairix/knowledge/graph/client.py may name `default_access_mode` / the
# `_is_write_query` derivation; any other module re-deriving read-vs-write is the
# #628 silent-write class (a write issued on a READ session, swallowed). Forward
# regression guard, not a detector of the (already-fixed) original.
[tool.tc_fitness.core_checks.pattern_chokepoint]
roots = ["kairix"]
extensions = [".py"]
patterns = ["default_access_mode", "_is_write_query"]
exempt_files = ["kairix/knowledge/graph/client.py"]
name = "cypher-write-mode-chokepoint"

# F96 — embed-discovery completeness queries must key on a STATE column. A
# `LEFT JOIN content_vectors ... IS NULL` that selects on presence alone counts an
# un-promoted (model-NULL) placeholder as "done" — the chunk-0 #627 class. Scoped
# to kairix/core/embed so the legitimately presence-only bronze-limbo check in
# kairix/core/db/integrity.py is out of scope (not a false positive).
[tool.tc_fitness.core_checks.integrity_state_predicate]
roots = ["kairix/core/embed"]
extensions = [".py"]
state_tables.content_vectors = ["model", "embedded_at"]
name = "embed-discovery-state-predicate"

# SGO-156 — no AI/LLM self-attribution residue (Autonomous Delivery Platform SP-A,
# decision D1). The banned-signature set is intrinsic to the engine; kairix binds
# only the first-party source/docs scan scope. NET-NEW residue fails; the per-file
# baseline (.architecture/baseline/no-llm-attribution-files.txt) grandfathers any
# pre-cutover residue (guard-forward, decision D2). This block is CODEOWNERS-gated
# (/pyproject.toml → @three-cubes/maintainers) so an agent cannot self-exempt.
[tool.tc_fitness.core_checks.no_llm_attribution]
roots = ["kairix", "scripts", "services", "docs"]
extensions = [".py", ".md", ".rst", ".txt", ".sh", ".yaml", ".yml", ".go", ".toml"]
name = "no-llm-attribution"

# SGO-158 — canonical commit identity (Autonomous Delivery Platform SP-A). Every
# commit author AND committer over cutover_ref..HEAD must be on allowed_emails: the
# canonical three-cubes-agent App, the named human maintainer, and the platform
# merge/bot committers observed on origin/main. cutover_ref (origin/main HEAD at
# adoption) bounds enforcement to commits made forward, so pre-cutover history is
# grandfathered (guard-forward, decision D2). CODEOWNERS-gated (see above): the
# allow-list can only be extended via a maintainer-approved control-plane edit.
[tool.tc_fitness.core_checks.canonical_commit_identity]
allowed_emails = [
    "295831460+three-cubes-agent[bot]@users.noreply.github.com",
    "10286112+quanyeomans@users.noreply.github.com",
    "noreply@github.com",
    "49699333+dependabot[bot]@users.noreply.github.com",
]
cutover_ref = "f40aad21a773222ef1d407d3ed32d62ad5d52ba4"  # pragma: allowlist secret — cutover SHA
name = "canonical-commit-identity"

# SGO-270 Wave 2 — the root harness references the central engineering canon. As a
# repo_type="product", kairix must carry the full root harness set (CLAUDE.md,
# AGENTS.md, RESOLVER.md, ETHOS.md, SCORECARD.md, CONTRIBUTING.md), and at least one
# harness file must carry BOTH the `Canonical standards` marker AND a link matching
# `governance/STANDARDS` (CLAUDE.md's banner does). Drift detection stays OFF
# (no banner_path) until a single canonical banner source is adopted repo-wide.
[tool.tc_fitness.core_checks.harness_canon_reference]
repo_type = "product"
banner_marker = "Canonical standards"
standards_ref_pattern = "governance/STANDARDS"
name = "harness-canon-reference"

[tool.tc_fitness.core_checks.ci_consumes_shared_gate]
workflows_dir = ".github/workflows"
name = "ci-consumes-shared-gate"
