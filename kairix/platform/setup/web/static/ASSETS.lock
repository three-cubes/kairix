      "url": "https://unpkg.com/@picocss/pico@2.1.1/css/pico.classless.min.css",
      "rationale": "Pico classless gives the wizard its base typography and form styling with zero markup classes. Pinned to v2.1.1; an upgrade can reflow every screen, so it is a reviewed change with a screenshot pass."
    },
    "kairix.css": {
      "vendored": false,
      "version": "first-party",
