{
  "_comment": [
    "F89 vendored browser-asset manifest. Every file the wizard serves out of",
    "this static/ directory is pinned here by sha256 so a silent swap (a fresh",
    "htmx.min.js dropped in, an outdated pico that drifts from upstream) fails",
    "the build with a sha mismatch instead of shipping untraced. Regenerate the",
    "shas after a deliberate upgrade and record WHY in the rationale field.",
    "Owned by scripts/checks/check_f89_vendored_asset_manifest.py."
  ],
  "assets": {
    "htmx.min.js": {
      "vendored": true,
      "version": "1.9.12",
      "sha256": "73eabc44d978b226a667c62ca3c40e99236d11aa6f8fc8a27be6f0b36a73b42d",
      "url": "https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js",
      "rationale": "HTMX powers every async wizard interaction (hx-get/hx-post into the banner slot). Pinned to the 1.9.x line the templates were authored and tested against; bumping is a deliberate review-and-retest action, not a silent drop-in."
    },
    "pico.classless.min.css": {
      "vendored": true,
      "version": "2.1.1",
